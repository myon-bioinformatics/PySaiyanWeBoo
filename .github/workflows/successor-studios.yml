name: Successor studios
on:
  pull_request:
    paths:
      - pysaiyanweboo.py
      - 'tools/build/studio-audio/**'
      - tools/flutter_migration_inventory.py
      - docs/flutter-migration-inventory.json
      - tests/test_flutter.py
      - tests/integration/flutter_browser.py
      - .github/workflows/successor-studios.yml
  push:
    branches: [main]
concurrency:
  group: successor-studios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  successor:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Chromium only; push runs all three browsers.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: '3.15'
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: uv run --locked --only-group world-test python -m pytest -q tests/test_flutter.py
      - run: npm ci --prefix tools/build/studio-audio --ignore-scripts
      - run: python -S tools/build/studio-audio/build.py build/site/vendor
      - name: Verify two builds produce identical audio bytes
        run: |
          python -S tools/build/studio-audio/build.py build/repeat/vendor
          cmp build/site/vendor/tone-studio.min.js build/repeat/vendor/tone-studio.min.js
          cmp build/site/vendor/tone-studio.LICENSE.txt build/repeat/vendor/tone-studio.LICENSE.txt
      # ⏱ Chromium's libraries are already on the runner image (it ships Chrome); apt only for Firefox / WebKit (9 min on a slow mirror)
      - run: uv run --locked --only-group world-test python -m playwright install ${{ matrix.browser != 'chromium' && '--with-deps' || '' }} ${{ matrix.browser }}
      - name: Start a virtual audio output for headless browser signal tests
        env:
          NEEDRESTART_SUSPEND: "1"
        run: |
          set -euo pipefail
          # ⏱ the runner image's lists already name these; `apt-get update` (minutes on a slow mirror) only if that fails
          install() { sudo --preserve-env=NEEDRESTART_SUSPEND apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils; }
          install || { sudo apt-get update -qq && install; }
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=studio_test
          pactl set-default-sink studio_test
          pactl load-module module-native-protocol-tcp listen=127.0.0.1 port=4714 auth-ip-acl=127.0.0.1
          pactl info
      - run: uv run --locked --only-group world-test python tests/integration/flutter_browser.py -v
        # 🌱 the tests read these names: rename them together with the list in tests/support.py
        env:
          PSWB_BROWSER: ${{ matrix.browser }}
          PULSE_SERVER: tcp:127.0.0.1:4714
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studio-audio-measurement-${{ matrix.browser }}
          path: build/site/vendor/
          retention-days: 14
