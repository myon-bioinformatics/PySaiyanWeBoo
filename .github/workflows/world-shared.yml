name: Shared world board
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: '3.15'
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # Node 26 runs the world.js harnesses the Python tests hold; Chromium comes from the Python Playwright in uv.lock.
      - run: PYTHONPATH=. uv run --locked --only-group world-test python -m pytest -q tests/test_worlds.py
      - run: uv run --locked --only-group world-test python -m playwright install --with-deps chromium
      - run: uv run --locked --only-group world-test python tests/integration/worlds_browser.py -v
