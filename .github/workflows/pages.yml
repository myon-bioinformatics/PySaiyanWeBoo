name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@98a0e611cc879fde2d047da806de5a2121a65524
    with:
      artifact_path: .
      # HTML is built from Python, not committed: the cities review page comes from its committed manifest.json.
      build: python3 -S -c "import sys; sys.path.insert(0, 'tests'); import support; support.write_city_gallery_page('docs/evidence/cities-20261111')"
