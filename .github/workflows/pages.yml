name: Pages

on:
  push:
    branches: [main]
  pull_request:          # 📚 builds the usage guide (an invalid spec fails here); only main deploys
    paths:
      - "docs/guide.page.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@43cfe1df924ea96ca44f47a6771c18102c38f7f3
    with:
      artifact_path: .
      # 📚 index.html stays the front page (the UI); the usage guide with the full 🧩 機能一覧 goes under guide/
      guide_page: docs/guide.page.json
      guide_dir: guide
      guide_brand: PySaiyanWeBoo
      build: "python3 -S pysaiyanweboo.py --site ."
