name: Pages

on:
  push:
    branches: [main]
  pull_request:          # 📚 builds the usage guide (an invalid spec fails here); only main deploys
    paths:
      - "docs/guide.page.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@27dedd9651efc816fa88d8922adb5f242725df69
    with:
      artifact_path: .
      # 📚 index.html is the usage guide (🧩 機能一覧 / 🔬 検証ガイド / 🎞 GIF デモ, like every repository); the front (the UI) is ui.html
      guide_page: docs/guide.page.json
      guide_brand: PySaiyanWeBoo
      build: "python3 -S pysaiyanweboo.py --site ."
