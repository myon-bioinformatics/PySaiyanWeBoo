name: Local Gradio DOM
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@27c46411c0a07d9b4d0f1ad5751ed1bb9e869b5c

  gradio-dom:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/BrowserTestKit
          ref: 9d3183ab9244c763be519ee18ca513205c4d3374
          path: .browser-test-kit-dom
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 'latest'
          python-version: "3.15"
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # ⏱ Chromium's libraries are already on the runner image (it ships Chrome), so no apt (5 min on a slow mirror)
      - run: uv run --locked --group gradio python -m playwright install --only-shell chromium
      - name: Pages in Chromium (controls, layout presets, route table and source panel offline and over HTTP, jsDelivr Plotly)
        run: uv run --locked --group gradio python tests/integration/pages_browser.py -v
      - name: Compare Gradio DOM with shared extraction (the test finds .browser-test-kit-dom and writes build/gradio-dom)
        run: uv run --group gradio pytest -v tests/integration/test_gradio_dom.py --junitxml=build/gradio-dom/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gradio-dom-evidence
          path: build/gradio-dom
          if-no-files-found: error
