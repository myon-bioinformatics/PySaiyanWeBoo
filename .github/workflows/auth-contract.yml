name: Local auth contract

on:
  pull_request:
    paths:
      - 'pysaiyanweboo.py'
      - 'tests/test_mock_auth.py'
      - 'tests/fixtures/mock_auth_contract.json'
      - '.github/workflows/auth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'pysaiyanweboo.py'
      - 'tests/test_mock_auth.py'
      - 'tests/fixtures/mock_auth_contract.json'
      - '.github/workflows/auth-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stdlib contracts and loopback HTTP
        run: |
          python3 -S -m unittest discover -s tests -p test_mock_auth.py -v
          python3 -S -O -m unittest discover -s tests -p test_mock_auth.py -v
